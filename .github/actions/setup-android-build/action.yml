name: Setup Android Build Environment
description: Configures JDK 17 and Gradle 8.7 with caching for VideoLiveWallpaper CI jobs

runs:
  using: composite
  steps:
    - uses: actions/setup-java@v4
      with:
        distribution: temurin
        java-version: '17'
    - uses: gradle/actions/setup-gradle@v4
      with:
        gradle-version: '8.7'
